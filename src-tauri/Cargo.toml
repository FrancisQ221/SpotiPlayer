[package]
name = "spotiplayer-desktop"
version = "1.0.0"
description = "SpotiPlayer - Audiophile Hi-Res Player with Ethical Patronage"
authors = ["SpotiPlayer Team"]
edition = "2021"

[lib]
name = "spotiplayer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Media_Control",
    "Storage_Streams",
    "Foundation",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
