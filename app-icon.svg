<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#14222b"/>
      <stop offset="70%" stop-color="#0e141a"/>
      <stop offset="100%" stop-color="#070b0e"/>
    </radialGradient>

    <!-- Emerald Neon Gradient -->
    <linearGradient id="emeraldNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34f5b5"/>
      <stop offset="60%" stop-color="#00e599"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Amber Patron Glow -->
    <linearGradient id="amberPatron" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Container with Glass Border -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGlow)" stroke="#00e599" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Outer Vinyl Audio Groove Accent -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#263b47" stroke-width="2" stroke-dasharray="14 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#00e599" stroke-width="3" stroke-opacity="0.25"/>

  <!-- Golden Patron Resonance Ring -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="url(#amberPatron)" stroke-width="4" stroke-opacity="0.7" stroke-dasharray="8 6"/>

  <!-- Center Master Disc -->
  <circle cx="256" cy="256" r="85" fill="#101920" stroke="url(#emeraldNeon)" stroke-width="4" filter="url(#neonGlow)"/>

  <!-- Modern Dynamic Waveform Bars (Audiophile Studio Signature) -->
  <rect x="200" y="236" width="10" height="40" rx="5" fill="url(#emeraldNeon)" />
  <rect x="222" y="216" width="10" height="80" rx="5" fill="url(#emeraldNeon)" filter="url(#neonGlow)"/>
  <rect x="244" y="196" width="10" height="120" rx="5" fill="#ffffff" />
  <rect x="266" y="210" width="10" height="92" rx="5" fill="url(#emeraldNeon)" filter="url(#neonGlow)"/>
  <rect x="288" y="230" width="10" height="52" rx="5" fill="url(#emeraldNeon)" />
  <rect x="310" y="246" width="10" height="20" rx="5" fill="url(#amberPatron)" />

  <!-- Center Pin & Bit-Perfect Indicator Dot -->
  <circle cx="256" cy="256" r="6" fill="#00e599"/>
</svg>
